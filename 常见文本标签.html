<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>常见文本标签</title>
</head>
<body>
    <!--下面的是文本标签示例-->
    <!--<h>是标题标签，可以分多级-->
    <h1>一级标签</h1>
    <h2>二级标签</h2>
    <!--<p>是段落标签-->
    <p>这是一个段落标签</p>

    <!--<ul>是无序列表-->
    <ul>
        <li>无序列表元素1</li>
        <li>无序列表元素2</li>
        <li>无序列表元素3</li>
    </ul>
    <!--<ol>是无序列表-->
    <ol>
        <li>有序列表元素1</li>
        <li>有序列表元素2</li>
        <li>有序列表元素3</li>
    </ol>
    <!--<table>是表格标签-->
    <table border="1">
        <!--<tr>是table row，也就是行-->
        <tr>
            <!--<th>是table header，也就是表头-->
            <th>列标题1</th>
            <th>列标题2</th>
            <th>列标题3</th>
        </tr>
        <tr>
            <!--<td>是table data，也就是表格数据-->
            <td>元素1</td>
            <td>元素2</td>
            <td>元素3</td>
        </tr>
    </table>
</body>
</html>
